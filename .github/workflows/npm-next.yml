# A canary for the next build and type tools: install the next versions over
# the lockfile's, type-check and build with them, lint on its own (a linter
# that does not take the next compiler yet is the heads-up, said as a
# warning), then optionally run the suites. A peer range that refuses a next
# version is itself a heads-up: warned, then installed with
# --legacy-peer-deps. From Lure.
#
#   npm-next:
#     uses: Gelaende51/development-template/.github/workflows/npm-next.yml@v1
#     with:
#       next: typescript@next esbuild@latest eslint@latest typescript-eslint@latest
#       check: npx tsc -noEmit -skipLibCheck && node esbuild.config.mjs production
#       lint: npx eslint src
#       setup: command -v xvfb-run || (sudo apt-get update -q && sudo apt-get install -y -q xvfb)
#       run: .dev/ci-suites.sh
name: npm next
on:
  workflow_call:
    inputs:
      next: { type: string, required: true, description: "Package specs to install over the lockfile's" }
      show: { type: string, default: "", description: "Packages to list after installing (npm ls)" }
      check: { type: string, required: true }
      lint: { type: string, default: "" }
      setup: { type: string, default: "" }
      suites: { type: string, default: "" }
      versions: { type: string, default: latest }
      run: { type: string, default: "" }
      suite-env: { type: string, default: "" }
      node-version: { type: string, default: "24" }
      timeout: { type: number, default: 150 }

jobs:
  next:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - name: The next versions
        env:
          NEXT: ${{ inputs.next }}
          SHOW: ${{ inputs.show }}
        run: |
          if ! npm install --no-save $NEXT 2>/tmp/npm.err; then
            grep -E "Could not resolve|peer .* from" /tmp/npm.err | sed 's/^npm error /::warning::npm-next: /' | head -5
            npm install --no-save --legacy-peer-deps $NEXT
          fi
          [ -z "$SHOW" ] || npm ls $SHOW --depth=0 || true
      - name: Type-check and build with them
        run: ${{ inputs.check }}
      - name: Lint with them
        if: inputs.lint != ''
        env:
          LINT: ${{ inputs.lint }}
        run: |
          if ! eval "$LINT" > /tmp/lint.log 2>&1; then
            tail -20 /tmp/lint.log
            echo "::warning::npm-next: lint fails with the next versions: $(grep -m1 -E 'Error:|error ' /tmp/lint.log | cut -c1-160)"
          fi
      - name: Setup
        if: inputs.setup != '' && inputs.run != ''
        run: ${{ inputs.setup }}
      - name: Run the suites
        if: inputs.run != ''
        env:
          SUITES: ${{ inputs.suites }}
          VERSIONS: ${{ inputs.versions }}
          SUITE_ENV: ${{ inputs.suite-env }}
          RUN: ${{ inputs.run }}
        run: |
          while IFS= read -r line; do if [ -n "$line" ]; then export "$line"; fi; done <<< "$SUITE_ENV"
          eval "$RUN"
